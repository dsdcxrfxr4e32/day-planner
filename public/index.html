<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script>if('scrollRestoration'in history)history.scrollRestoration='manual';</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=GFS+Didot&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<meta name="theme-color" content="#F6F5F1">
<meta name="robots" content="noindex">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta name="build" content="__BUILD__">
<meta name="auth" content="__AUTH__">
<meta name="user" content="__USER__">
<title>Plano</title>
<style>
:root{--bg:#fff;--subtle:#f6f7f9;--elev:#fff;--bd:#e2e5e9;--bds:#eceef1;--focus:#3b6cf6;--t1:#111418;--t2:#4a5059;--t3:#8a9099;--ok:#1f9d55;--bad:#d93025;--warn:#b26a00;--acc:#eaf0ff;--fill:#eceef1;--r:8px}
*{box-sizing:border-box}
/* IBM Plex Sans Regular / Medium / SemiBold. Google Fonts serves the Greek subset (and Latin) by unicode-range. */
body{margin:0;background:var(--bg);color:var(--t1);font:400 14px/20px "IBM Plex Sans",sans-serif}
button,input,textarea,select{font-family:inherit}
b,strong{font-weight:600}
/* Desktop top padding sits the title row (h1 + Refresh / toggles) clearly below the browser chrome. */
.wrap{max-width:1600px;margin:0 auto;padding:72px 20px 80px}
h1{font-size:24px;line-height:30px;margin:0;font-weight:600}
.summary{color:var(--t2);margin:4px 0 0}
.top{display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px;align-items:flex-start}
.topr{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:flex-end}
section{margin-top:24px}
h2{font-size:16px;line-height:22px;margin:0 0 4px;font-weight:600}
.cap{color:var(--t3);font-size:12px;margin:0 0 10px}
.small{font-size:12px;line-height:16px;color:var(--t3)}
.row{display:flex;flex-wrap:wrap;gap:12px}
.load{flex:1 1 220px;border:1px solid var(--bd);border-radius:12px;padding:16px;background:var(--bg)}
.colwrap{flex:1 1 280px;min-width:0;display:flex;flex-direction:column;gap:8px}
.colwrap>.col{flex:1 1 auto}
.load.cmp{flex:none;padding:10px 14px}
.load.spacer{visibility:hidden}
.load{position:relative}
.bar>div.mseg{background:#7b93c9;border-radius:999px 0 0 999px}
.bar>div.mseg+div{border-radius:0 999px 999px 0}
.mt{cursor:pointer;display:flex;align-items:center;gap:6px;height:16px}
.mt:hover{color:var(--t2);text-decoration:underline}
.msw{width:8px;height:8px;border-radius:2px;background:#7b93c9;display:inline-block}
.mlist{position:absolute;left:8px;right:8px;top:calc(100% - 4px);z-index:50;background:var(--elev);border:1px solid var(--bd);border-radius:8px;box-shadow:0 6px 18px rgba(0,0,0,.14);padding:6px 10px;font-size:12px;line-height:18px;color:var(--t1)}
.mgrp{margin-bottom:10px}
.mblk{display:block;color:inherit;text-decoration:none;background:#eef2fa;border:1px solid #d5ddef;border-left:4px solid #7b93c9;border-radius:var(--r);padding:8px 12px;margin-bottom:6px;cursor:pointer}
.mblk:hover{border-color:#7b93c9}
.mblk.tent{background:#f7f9fd;border:1px dashed #9fb1d8;border-left:4px dashed #9fb1d8;opacity:.75}
.mblk.tent:hover{opacity:1}
.tlbl{font-size:10px;font-weight:600;letter-spacing:.3px;text-transform:uppercase;color:#6a7fae;border:1px dashed #9fb1d8;border-radius:4px;padding:0 4px;margin-left:4px;vertical-align:1px}
.ext{visibility:hidden;color:#3d5a99}
.mblk:hover .ext,.mli:hover .ext{visibility:visible}
.mli{display:block;color:inherit;text-decoration:none;padding:2px 0;overflow-wrap:anywhere;cursor:pointer}
.mli:hover{color:#3d5a99}
.mli.tent{opacity:.7}
.mblk.zero{padding:2px 12px;font-size:12px;line-height:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mall{display:block;color:#3d5a99;text-decoration:none;background:#e4eaf6;border-radius:999px;font-size:11px;line-height:16px;padding:1px 10px;margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.mall:hover .ext{visibility:visible}
.addb{border:1px solid var(--bd);background:var(--bg);color:var(--t2);border-radius:6px;font:600 16px/20px inherit;font-family:inherit;width:26px;height:26px;padding:0;margin-left:6px;vertical-align:4px;cursor:pointer}
.addb:hover{border-color:var(--focus);color:var(--t1)}
.mblk .mtop{display:flex;justify-content:space-between;gap:8px}
.mblk .mtime2{font-size:12px;font-weight:600;color:#3d5a99;font-variant-numeric:tabular-nums}
.mblk .mtitle{font-weight:500;overflow-wrap:anywhere}
.mlist>div{padding:2px 0;overflow-wrap:anywhere}
.mtime{color:var(--t3);display:inline-block;min-width:92px;font-variant-numeric:tabular-nums}
@media (max-width:611px){.load.spacer{display:none}}
.load.cmp .metric{font-size:22px;line-height:28px;margin:2px 0 4px}
.load.cmp .bar{height:10px}
.load .hd{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.metric{font-size:28px;line-height:34px;font-weight:600;margin:6px 0 10px}
.bar{height:16px;border-radius:999px;background:var(--fill);overflow:hidden}
.bar>div{height:100%;border-radius:999px;background:var(--ok)}
.chip{border:1px solid var(--bd);background:var(--bg);color:var(--t2);border-radius:999px;font:inherit;padding:6px 14px;cursor:pointer}
.chip.on{border-color:var(--focus);background:var(--acc);color:var(--t1);font-weight:600}
.btn{border:1px solid var(--bd);background:var(--bg);color:var(--t2);border-radius:6px;font:12px/18px inherit;font-family:inherit;padding:0 7px;cursor:pointer}
.btn:hover{border-color:var(--t3)}
.bbig{font-size:13px;line-height:20px;padding:5px 12px;border-radius:8px}
.tog{display:inline-flex;align-items:center;gap:8px;cursor:pointer;user-select:none;color:var(--t2)}
.tog input{display:none}
.tog .sw{width:34px;height:20px;border-radius:999px;background:var(--fill);position:relative;transition:.15s}
.tog .sw::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.25);transition:.15s}
.tog input:checked+.sw{background:var(--focus)}
.tog input:checked+.sw::after{left:16px}
.lane{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-start}
.col{flex:1 1 280px;min-width:0;background:var(--subtle);border:1px solid var(--bds);border-radius:12px;padding:12px;min-height:120px}
.col.hot{background:var(--acc);border:1px dashed var(--focus)}
.colhd{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px;gap:8px;flex-wrap:wrap}
.colhd b{font-size:14px;font-weight:600}
.scroll{max-height:640px;overflow-y:auto;padding-right:2px}
.grp{margin-bottom:10px}
.grphd{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap;padding:4px 2px 6px;margin-bottom:6px;border-bottom:1px solid var(--bds)}
.grphd .lbl{font-size:24px;line-height:1.2;font-weight:600;letter-spacing:.3px}
.card{background:var(--elev);border:1px solid var(--bd);border-radius:var(--r);padding:10px 12px;margin-bottom:8px;cursor:grab;position:relative}
.card.gray{background:var(--subtle);border-style:dashed;opacity:.6}
.card.muted{opacity:.62}
.card.drag{opacity:.45}
.card .nm{color:var(--t1);font-weight:500;display:block;overflow-wrap:anywhere;padding-right:30px;text-decoration:none;cursor:pointer}
.card .nm:hover{text-decoration:underline}
.card.gray .nm{color:var(--t2)}
.card.muted .nm{text-decoration:line-through}
.card .dd{cursor:pointer;border-radius:4px;padding:0 2px;margin:0 -2px}
.card .dd:hover{background:var(--fill);text-decoration:underline}
.duepick{display:inline-flex;align-items:center;gap:4px}
.duepick input{font:12px/18px inherit;font-family:inherit;border:1px solid var(--focus);border-radius:6px;padding:0 4px;color:var(--t1)}
.mbg{position:fixed;inset:0;z-index:2000;background:rgba(17,20,24,.35);display:flex;justify-content:flex-end}
.pane{width:min(560px,100%);height:100%;background:var(--elev);box-shadow:-8px 0 24px rgba(0,0,0,.18);display:flex;flex-direction:column}
.pane .phd{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 20px;border-bottom:1px solid var(--bds)}
.pane .pbody{flex:1;overflow-y:auto;padding:16px 20px}
.pane .pft{display:flex;align-items:center;gap:8px;padding:12px 20px;border-top:1px solid var(--bds)}
.pane .tname{width:100%;font:600 20px/28px inherit;font-family:inherit;color:var(--t1);border:1px solid transparent;border-radius:6px;padding:4px 6px;margin:0 -6px 12px;resize:none}
.pane .tname:hover{border-color:var(--bd)}.pane .tname:focus,.pane textarea:focus,.pane input:focus{outline:none;border-color:var(--focus)}
.pane .f{display:grid;grid-template-columns:110px 1fr;align-items:center;gap:8px;min-height:36px}
.pane .f>label{color:var(--t3);font-size:13px}
.pane input[type=date]{font:13px/20px inherit;font-family:inherit;border:1px solid var(--bd);border-radius:6px;padding:4px 6px;color:var(--t1)}
.pane .desc{display:block;color:var(--t3);font-size:13px;margin:16px 0 6px}
.pane textarea.notes{width:100%;min-height:260px;font:14px/20px inherit;font-family:inherit;color:var(--t1);border:1px solid var(--bd);border-radius:8px;padding:8px 10px;resize:vertical}
.pane .note{font-size:12px;color:var(--t3);margin-top:6px}
.pane .perr{background:#fdecea;color:#8a1c12;border:1px solid #f5c2bd;border-radius:8px;padding:8px 10px;font-size:13px;margin-bottom:12px}
.btnp{border:1px solid var(--focus);background:var(--focus);color:#fff;border-radius:8px;font:13px/20px inherit;font-family:inherit;padding:5px 14px;cursor:pointer}
.btnp[disabled]{opacity:.6;cursor:default}
.pane a.asana{font-size:12px;color:var(--t3);margin-left:auto}
.dot{position:absolute;top:8px;right:8px;width:24px;height:24px;border-radius:50%;border:3px solid var(--t3);background:#fff;color:#fff;font-size:13px;line-height:18px;padding:0;text-align:center;cursor:pointer}
.dot:hover{border-color:var(--ok)}
.dot.on{border-color:var(--ok);background:var(--ok)}
.meta{margin-top:4px;display:flex;flex-wrap:wrap;align-items:center;gap:2px 10px}
.who{margin-left:auto;display:inline-flex;gap:4px;flex-wrap:wrap}
.ac{border:1px solid var(--bd);background:var(--bg);color:var(--t2);border-radius:999px;font:11px/16px inherit;font-family:inherit;padding:0 8px;cursor:pointer}
.ac:hover{border-color:var(--t3)}
.ac.on{border-color:var(--focus);background:var(--acc);color:var(--t1);font-weight:600}
.ctl{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:8px}
.mins{font-size:12px;font-weight:600;min-width:48px;text-align:center}
.pill{background:#e7f6ee;color:var(--ok);border-radius:999px;padding:0 6px;font-weight:600}
.over{color:var(--bad)}.due{color:var(--warn)}
.empty{padding:24px 8px;text-align:center}
.toast{position:fixed;left:16px;bottom:16px;z-index:1000;display:flex;align-items:center;gap:10px;max-width:440px;padding:8px 10px 8px 14px;background:var(--elev);border:1px solid var(--bd);border-radius:10px;box-shadow:0 4px 16px rgba(0,0,0,.18)}
.toast span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;color:var(--t2);font-size:12px}
.err{position:fixed;right:16px;bottom:16px;z-index:1001;max-width:460px;padding:10px 14px;background:#fdecea;color:#8a1c12;border:1px solid #f5c2bd;border-radius:10px;font-size:13px}
.status{font-size:12px;color:var(--t3)}
.spin{display:inline-block;width:10px;height:10px;border:2px solid var(--t3);border-top-color:transparent;border-radius:50%;animation:s 0.8s linear infinite;vertical-align:-1px}
@keyframes s{to{transform:rotate(360deg)}}
.loading{padding:60px;text-align:center;color:var(--t3)}
/* ---------- mobile (UI only; desktop untouched above 720px) ---------- */
.mob,.seg{display:none}
.colwrap[data-kind=a]{display:none}
.btn[disabled]{opacity:.4;cursor:default}
.colsub{display:flex;justify-content:space-between;gap:8px;font-size:12px;line-height:16px;font-weight:600;text-transform:uppercase;letter-spacing:.4px;color:var(--t3);margin:8px 2px 6px}
@media (max-width:720px){
  html{-webkit-text-size-adjust:100%}
  body{overflow-x:hidden}
  .dsk{display:none}
  .mob{display:inline-flex}
  .wrap{padding:12px max(12px,env(safe-area-inset-right)) 96px max(12px,env(safe-area-inset-left))}
  h1{font-size:20px;line-height:26px}
  .summary{font-size:13px}
  .top{gap:8px}.topr{justify-content:flex-start;gap:8px 12px}
  section{margin-top:18px}
  .load{flex:1 1 100%;padding:12px 14px}
  .row>.load{flex:1 1 calc(50% - 6px);padding:10px 12px}
  .row>.load .metric{font-size:20px;line-height:26px;margin:2px 0 4px}
  .row>.load .bar{height:10px}
  .metric{font-size:22px;line-height:28px;margin:4px 0 6px}
  .bbig{min-height:40px;padding:8px 14px}
  .btn{min-height:40px;min-width:40px;padding:0 10px;font-size:13px}
  .chip{min-height:40px;padding:8px 16px}
  .tog{min-height:40px}
  .mt{min-height:40px;height:auto}
  .addb{width:40px;height:40px;font-size:20px;vertical-align:2px}
  .ftog{align-items:center;gap:8px;min-height:40px;border:1px solid var(--bd);background:var(--bg);color:var(--t1);border-radius:8px;font:600 15px/20px inherit;font-family:inherit;padding:8px 14px;cursor:pointer}
  .ftog .small{font-weight:400}
  .fbody{display:none;margin-top:10px}
  .fbody.open{display:block}
  /* one column at a time per person, chosen with a sticky segmented control */
  .seg{display:flex;position:sticky;top:0;z-index:40;gap:4px;padding:6px 0;margin:0 0 8px;background:var(--bg)}
  .seg button{flex:1 1 0;min-width:0;min-height:48px;border:1px solid var(--bd);background:var(--subtle);color:var(--t2);border-radius:10px;font:600 12px/14px inherit;font-family:inherit;padding:4px 2px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center}
  .seg button .small{font-size:10px;font-weight:400;font-variant-numeric:tabular-nums;white-space:nowrap}
  .seg button.on{background:var(--acc);border-color:var(--focus);color:var(--t1)}
  .lane{display:block}
  .lane .colwrap{display:none}
  .lane[data-tab=b] .colwrap[data-kind=b],.lane[data-tab=t] .colwrap[data-kind=t],.lane[data-tab=w] .colwrap[data-kind=w],.lane[data-tab=mo] .colwrap[data-kind=mo],.lane[data-tab=a] .colwrap[data-kind=a]{display:flex}
  .col{padding:10px;min-height:80px}
  .scroll{max-height:none;overflow:visible;padding-right:0}
  .grphd .lbl{font-size:18px}
  .card{padding:10px 12px;cursor:default}
  .card .nm{padding-right:44px;min-height:32px}
  .dot{top:4px;right:4px;width:40px;height:40px;border-width:8px;border-color:var(--elev);box-shadow:inset 0 0 0 3px var(--t3);line-height:22px}
  .dot.on{border-color:var(--elev);box-shadow:none}
  .meta{gap:4px 10px}
  .card .dd{display:inline-flex;align-items:center;min-height:40px;padding:0 4px}
  .duepick{flex-wrap:wrap}
  .duepick input{min-height:40px;font-size:16px}
  .who{margin-left:0;width:100%;gap:6px}
  .ac{min-height:40px;padding:0 14px;font-size:13px;flex:1 1 auto}
  .ctl{gap:6px}
  .ctl>span[style*="flex:1"]{flex-basis:100%!important;height:0}
  .ctl>.btn[data-act=today],.ctl>.btn[data-act=tomorrow],.ctl>.btn[data-act=monday],.ctl>.btn[data-act=back]{flex:1 1 0}
  .mblk{padding:10px 12px}
  .mall{line-height:22px;padding:4px 12px}
  .mlist{left:0;right:0}
  .mli{padding:8px 0}
  .ext{visibility:visible}
  /* edit panel → full-screen sheet */
  .mbg{background:var(--elev)}
  .pane{width:100%;height:100%;height:100dvh;box-shadow:none}
  .pane .phd{padding:8px 12px;padding-top:max(8px,env(safe-area-inset-top))}
  .pane .pbody{padding:14px 16px}
  .pane .pft{flex-wrap:wrap;padding:10px 16px;padding-bottom:max(10px,env(safe-area-inset-bottom))}
  .pane .f{grid-template-columns:1fr;gap:4px;margin-bottom:10px}
  .pane .tname{font-size:18px;line-height:26px}
  .pane input[type=date],.pane textarea.notes{font-size:16px}
  .pane input[type=date]{min-height:40px}
  .pane textarea.notes{min-height:200px}
  .btnp{min-height:44px;padding:10px 22px;font-size:15px}
  .pane a.asana{display:inline-flex;align-items:center;min-height:40px}
  .toast{left:8px;right:8px;bottom:max(8px,env(safe-area-inset-bottom));max-width:none}
  .err{left:8px;right:8px;bottom:max(64px,env(safe-area-inset-bottom));max-width:none}
}
.allboard .scroll{max-height:none;overflow:visible}
</style>
<style id="precise-brand">
:root{--bg:#F6F5F1;--subtle:#F6F5F1;--elev:#FBFAF7;--bd:#DAD9D5;--bds:#DAD9D5;--focus:#1C1B18;--t1:#1C1B18;--t2:#6F6D66;--t3:#8F8C83;--ok:#1C1B18;--bad:#1C1B18;--warn:#1C1B18;--acc:#E4E2DB;--fill:#E4E2DB;--r:3px}

.mblk{background:#E4E2DB;border:1px solid #DAD9D5;border-left:3px solid #6F6D66}
.mblk:hover{border-color:#6F6D66}
.mblk.tent{background:transparent;border:1px dashed #B9B7B0;border-left:3px dashed #B9B7B0}
.mblk .mtime2,.ext,.mli:hover,.mall{color:#1C1B18}
.tlbl{color:#6F6D66;border-color:#B9B7B0;letter-spacing:1.2px}
.mall{background:#E4E2DB}
.mlist,.toast,.pane{box-shadow:none}
.mlist,.toast{border-color:#B9B7B0}
.pane{border-left:1px solid #B9B7B0}
.mbg{background:rgba(28,27,24,.18)}
.chip,.ac,.btn,.addb,.ftog,.seg button{border-radius:3px;border-color:#DAD9D5;background:transparent}
.chip.on,.ac.on,.seg button.on{border-color:#1C1B18;background:#E4E2DB;color:#1C1B18}
.btn:hover,.chip:hover,.ac:hover,.addb:hover{border-color:#6F6D66;color:#1C1B18}
.btnp{background:#1C1B18;border-color:#1C1B18;color:#F6F5F1;border-radius:3px}
.tog .sw{background:#DAD9D5}
.tog .sw::after{background:#F6F5F1;box-shadow:none}
.tog input:checked+.sw{background:#1C1B18}
.dot{border-color:#B9B7B0;background:transparent}
.dot:hover{border-color:#1C1B18}
.dot.on{border-color:#1C1B18;background:#1C1B18;color:#F6F5F1}
.pill{background:#E4E2DB;color:#1C1B18}
.mins{font-weight:500}
.over{color:#1C1B18;font-weight:600}
.due{color:#1C1B18;font-weight:500}
.err,.pane .perr{background:#E4E2DB;color:#1C1B18;border:1px solid #B9B7B0}
.spin{border-color:#6F6D66;border-top-color:transparent}
@media (max-width:720px){h1{font-size:34px}.wrap::before{margin-bottom:16px}.dot{border-color:#FBFAF7;box-shadow:inset 0 0 0 3px #B9B7B0}.dot.on{border-color:#FBFAF7;box-shadow:none;background:#1C1B18}.seg{background:#F6F5F1}}

  function showErr(msg) {

  }
  function load(force) {

    return api('GET', '/api/board' + (force ? '?refresh=1' : '')).then(function (b) {

  /* ---------- helpers ---------- */
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function hm(m) { var h = Math.floor(m / 60), r = m % 60; return h + ':' + (r < 10 ? '0' : '') + r; }
  function fmtDate(d) { if (!d) return 'No due date'; var p = d.split('-'); return p[2] + '/' + p[1] + '/' + p[0]; }

  // Tomorrow is always the next calendar day, so the button stays "Tomorrow".

    var t = S.board.today, w = S.board.tomorrow; if (!t || !w) return 'Tomorrow';

  }
  function byDue(a, b) { if (a.d && b.d) return a.d < b.d ? -1 : a.d > b.d ? 1 : 0; if (a.d) return -1; if (b.d) return 1; return 0; }
  function groupOf(x) {
    var p = (x.p.split(', ')[0] || '').trim();
    var pm = /^(\d{3})[a-z]?\s+(.+)$/.exec(p);
    if (pm) return { k: '0' + pm[1], label: pm[1] + ' ' + (CLIENTS[pm[1]] || pm[2]) };

  function groupTasks(items) {
    var m = {};
    items.forEach(function (x) { var g = groupOf(x); if (!m[g.k]) m[g.k] = { g: g, xs: [] }; m[g.k].xs.push(x); });

  }
  function tasks() { return S.board.tasks; }
  // The Asana project behind a section (for '+'): the most common first project among its tasks that
  // belongs to the section; else a workspace project with the section's code (prefer '<code>a').
  function sectionProject(grp) {
    var cnt = {}, best = null;
    grp.xs.forEach(function (x) {
      var pn = (x.p.split(', ')[0] || '').trim();
      if (!x.pg || !pn || groupOf({ p: pn, n: '' }).k !== grp.g.k) return;

  // Today column: open tasks, plus ones completed today (the "done" line only).
  function todayTasks(k) { return tasks().filter(function (x) { return x.t === k && (!x.c || x.c === today()); }); }
  function openOf(xs) { return xs.filter(function (x) { return !x.c; }); }

  /* ---------- actions ---------- */

  // slot: 't' Today, 'w' Tomorrow, 'mo' Monday, or '' Backlog. A task sits in at most one of them.
  // The column is the Asana due date (src 'd'). A leftover plan tag does not keep a card where it is.
  // force: the due date was just edited; place by that date.
  function replace(x, force) {

    var lane = x.a, d = x.d, b = S.board;

    x.w = !x.t && d && d === b.tomorrow ? lane : '';

  function slotOf(x) { return x.t ? { s: 't', k: x.t } : x.w ? { s: 'w', k: x.w } : x.mo ? { s: 'mo', k: x.mo } : null; }

    // due date follows the column (server sets it in the same call): Today, Tomorrow, Monday, or none
    x.d = slot === 't' ? S.board.today : slot === 'w' ? S.board.tomorrow : slot === 'mo' ? S.board.monday : '';

      x.t = oldT; x.w = oldW; x.mo = oldMo; x.d = oldD; x.src = oldSrc; showErr('Could not move "' + x.n.slice(0, 40) + '": ' + e.message + ' — Refresh to see the real state.');
    });
  }
  function assignChips(x, attr) {
    return '<span class="who">' + S.board.people.filter(function (p) { return p.k !== 'un'; }).map(function (p) {

  function clearToday() {

  // Calendar events shown as blocks at the top of a Today/Tomorrow column (title, times, link only).

      (mt.nt ? '<span style="font-weight:400"> + ' + mt.nt + ' tentative</span>' : '') + '</span></div>';
    (mt.allday || []).forEach(function (x) {

    });

    var v = readEditor(), t = E.data, body = {};
    var nm = v.name.replace(/[\r\n]+/g, ' ').trim();
    if (!nm) { E.err = 'Name cannot be empty.'; return paintEditor(); }
    if (E.isNew) return saveNew(E, v, nm);
    if (nm !== t.n) body.name = nm;
    if (v.notes.replace(/\r\n?/g, '\n') !== t.notes.replace(/\r\n?/g, '\n')) body.notes = v.notes;
    if (v.due_on !== t.d) body.due_on = v.due_on;
    if (!Object.keys(body).length) return closeEditor();
    E.saving = true; E.err = ''; paintEditor();
    api('POST', '/api/task/' + E.id, body).then(function (r) {
      var x = S.byId[r.i];
      if (x) { var dc = x.d !== r.d; x.n = r.n; x.d = r.d; x.m = r.m; x.e = r.e; replace(x, dc); }
      E.saving = false; S.ed = null; modal.innerHTML = ''; render();
    }).catch(function (e) { E.saving = false; E.err = 'Not saved: ' + e.message; paintEditor(); });
  }
  function saveNew(E, v, nm) {
    if (/^(\d{3}[a-z]?|PRE)$/i.test(nm)) { E.err = 'Type a task name after ' + nm + '.'; return paintEditor(); }
    var a = E.data.a, c = E.ctx, slotK = a !== 'un' ? a : c.k;
    var body = { name: nm, notes: v.notes, due_on: v.due_on, project: c.pg, a: a, slot: c.kind === 't' || c.kind === 'w' || c.kind === 'mo' ? { s: c.kind, k: slotK } : null };
    E.saving = true; E.err = ''; paintEditor();
    api('POST', '/api/task', body).then(function (x) {
      E.saving = false; S.ed = null; modal.innerHTML = '';
      S.board.tasks.push(x); S.byId[x.i] = x; render();
      if (!x.tagged) showErr('Task created, but it could not be added to ' + (c.kind === 't' ? 'Today' : c.kind === 'mo' ? 'Monday' : tomLbl()) + '; it is in the Backlog.');
    }).catch(function (e) { E.saving = false; E.err = 'Not created: ' + e.message; paintEditor(); });
  }
  modal.addEventListener('click', function (e) {
    var b = e.target.closest('[data-ed]');
    if (b) { var a = b.getAttribute('data-ed'); if (a === 'save') saveEditor(); else if (a === 'cancel') closeEditor(); else if (a === 'nodue') modal.querySelector('#ed-due').value = '';
      else if (a === 'assign') edAssign(b.getAttribute('data-k'));
      return; }
    if (e.target.getAttribute('data-mbg')) closeEditor();
  });
  modal.addEventListener('keydown', function (e) {
    if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') { e.preventDefault(); saveEditor(); }
    else if (e.key === 'Enter' && e.target.classList.contains('tname')) e.preventDefault();
  });

  /* ---------- events ---------- */
  document.addEventListener('click', function (e) {
    if (modal.contains(e.target)) return;
    if (S.meetOpen && !e.target.closest('.mlist,[data-act=meet]')) { S.meetOpen = null; render(); }
    var b = e.target.closest('[data-act]');
    if (!b) {
      if (e.target.closest('.duepick')) return;
      var c = e.target.closest('.card');
      if (c && !e.target.closest('button,input,a')) openEditor(c.getAttribute('data-id'));
      else if (S.dueEdit && !c) closeDue();
      return;
    }
    var id = b.getAttribute('data-id'), act = b.getAttribute('data-act');
    if (act === 'due') openDue(id);
    else if (act === 'dueclear') saveDue(id, '');
    else if (act === 'duecancel') closeDue();
    else if (act === 'done') markDone(id);
    else if (act === 'bump') bump(id, Number(b.getAttribute('data-d')));
    else if (act === 'today') toToday(id, b.getAttribute('data-k'));
    else if (act === 'tomorrow') toTomorrow(id, b.getAttribute('data-k'));
    else if (act === 'monday') toMonday(id, b.getAttribute('data-k'));
    else if (act === 'assign') assign(id, b.getAttribute('data-k')).catch(function () {});
    else if (act === 'back') toBacklog(id);
    else if (act === 'who') { S.who = b.getAttribute('data-k'); render(); }
    else if (act === 'undo') undoLast();
    else if (act === 'clear') clearToday();
    else if (act === 'refresh') load(true);
    else if (act === 'logout') fetch('/api/logout', { method: 'POST', credentials: 'same-origin' }).finally(function () { location.href = '/'; });
    else if (act === 'new') openNew(b);
    else if (act === 'mtab') { S.tab[b.getAttribute('data-k')] = b.getAttribute('data-kind'); render(); }
    else if (act === 'ftog') { S.fOpen = !S.fOpen; render(); }
    else if (act === 'meet') { S.meetOpen = S.meetOpen === b.getAttribute('data-mk') ? null : b.getAttribute('data-mk'); render(); }
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') { if (S.ed) closeEditor(); else closeDue(); return; }
    if ((e.key === 'Enter' || e.key === ' ') && e.target.getAttribute) {
      var o = e.target.getAttribute('data-open'); if (o) { e.preventDefault(); openEditor(o); return; }
      if (e.target.getAttribute('data-act') === 'due') { e.preventDefault(); openDue(e.target.getAttribute('data-id')); }
      if (e.target.getAttribute('data-act') === 'meet') { e.preventDefault(); e.target.click(); }
    }
  });
  document.addEventListener('change', function (e) {
    var di = e.target.getAttribute && e.target.getAttribute('data-due-input');
    if (di) { var v = e.target.value; if (!v || /^(19|20)\d\d-\d\d-\d\d$/.test(v)) saveDue(di, v); return; }
    var t = e.target.getAttribute && e.target.getAttribute('data-tog'); if (!t) return;
    S[t] = e.target.checked;
    if (t === 'showCal') { try { localStorage.setItem('dp-showCal', S.showCal ? '1' : '0'); } catch (err) {} }
    render();
  });
  document.addEventListener('dragstart', function (e) {
    var c = e.target.closest && e.target.closest('.card'); if (!c) return;
    S.drag = c.getAttribute('data-id'); e.dataTransfer.setData('text/plain', S.drag); e.dataTransfer.effectAllowed = 'move';
    c.classList.add('drag');
  });
  document.addEventListener('dragend', function () { S.drag = null; S.over = null; [].forEach.call(document.querySelectorAll('.hot,.drag'), function (el) { el.classList.remove('hot', 'drag'); }); });
  document.addEventListener('dragover', function (e) {
    var z = e.target.closest && e.target.closest('.col'); if (!z || !S.drag || z.getAttribute('data-kind') === 'a') return;
    e.preventDefault(); e.dataTransfer.dropEffect = 'move';
    if (S.over !== z.getAttribute('data-zone')) {
      [].forEach.call(document.querySelectorAll('.col.hot'), function (el) { el.classList.remove('hot'); });
      S.over = z.getAttribute('data-zone'); z.classList.add('hot');
    }
  });
  document.addEventListener('drop', function (e) {
    var z = e.target.closest && e.target.closest('.col'); if (!z || z.getAttribute('data-kind') === 'a') return;
    e.preventDefault();
    var id = e.dataTransfer.getData('text/plain') || S.drag, x = S.byId[id], k = z.getAttribute('data-k'), kind = z.getAttribute('data-kind');
    S.drag = null; S.over = null;
    if (!x || !canTake(x, k)) return render();
    if (kind === 't') toToday(id, k); else if (kind === 'w') toTomorrow(id, k); else if (kind === 'mo') toMonday(id, k); else if (x.t === k || x.w === k || x.mo === k) toBacklog(id); else render();
  });

  // back/forward cache restore: fetch a fresh page instead of showing the frozen one
  window.addEventListener('pageshow', function (e) { if (e.persisted) location.reload(); });
  // phone tab brought back after a while: reload the board (which also catches a new deploy)
  var hiddenAt = 0;
  document.addEventListener('visibilitychange', function () {
    if (document.hidden) hiddenAt = Date.now(); else if (hiddenAt && Date.now() - hiddenAt > 5 * 60000 && !S.loading) load();
  });
  load();
})();
</script>
</body>
</html>
